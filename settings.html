<!DOCTYPE html>
<html>

<head>

    <title>Settings</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="page-settings">

    <a href="index.html" class="home-icon">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="container">

        <h1>Settings</h1>

        <div class="settings-card">

<h2>
    <i class="fa-solid fa-school"></i>
    School Settings
</h2>

            <div class="settings-row">

                <label>School Name</label>

                <input
                    type="text"
                    id="schoolName">

            </div>

            <div class="settings-row">

                <label>Starting Spot</label>

                <input
                    type="number"
                    id="startSpot">

            </div>

            <div class="settings-row">

                <label>Ending Spot</label>

                <input
                    type="number"
                    id="endSpot">

            </div>

        </div>

        <div class="settings-card">

<h2>

    <i class="fa-solid fa-tv"></i>
    Dismissal Board
</h2>

            <div class="settings-row">
                <label>Cars Displayed</label>

                <input
                    type="number"
                    id="carsDisplayed">
            </div>

<div class="settings-helper settings-helper-tight">
    Controls how many tags appear on the Dismissal Board.
</div>

<div class="settings-toggle-row">
    <label>Show Spots On Board</label>
    <label class="switch">
        <input
            type="checkbox"
            id="showSpotsOnBoard">
        <span class="slider"></span>
    </label>
</div>

<div class="settings-helper">Displays destination spot numbers on the Dismissal Board.</div>


<div class="settings-toggle-row">
    <label>Allow Release From Board</label>
    <label class="switch">
        <input
            type="checkbox"
            id="boardReleaseEnabled">
        <span class="slider"></span>
    </label>
</div>


<div class="settings-helper">Allows staff to release students directly from the Dismissal Board.</div>

        </div>

<button
    id="saveSettingsBtn"
    class="btn-save-settings"
    onclick="saveSettings()">

    <i class="fa-solid fa-floppy-disk"></i>
    Save Settings

</button>

    </div>

    <script type="module" src="firebase.js"></script>

    <script src="app.js"></script>

    <script>

        window.addEventListener("load", async () => {

            await loadSettings();

        });

    </script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Confirm

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast hidden"></div>

</body>

</html>
