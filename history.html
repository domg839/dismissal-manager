<!DOCTYPE html>
<html>

<head>
    <title>Dismissal History</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="page-history">

<a href="home.html" class="home-icon">
    <i class="fa-solid fa-house"></i>
</a>

<a
    id="recentlyDeletedBtn"
    href="recently-deleted.html"
    class="trash-page-icon">

    <i class="fa-solid fa-clock-rotate-left"></i>

</a>

    <div class="container">
<h1>Dismissal History</h1>

<div id="historyDashboard"></div>

<div id="historyList"></div>


    </div>

<script type="module" src="firebase.js"></script>

<script src="app.js"></script>

<script>

window.addEventListener("load", () => {

    const isDemoMode =
        sessionStorage.getItem(
            "demoMode"
        ) === "true";

if (isDemoMode) {

    window.currentUserRole =
        "admin";

    document.getElementById(
        "recentlyDeletedBtn"
    ).style.display = "";

    window.dismissalHistory =
        getDemoHistory();

    renderHistory();

    return;

}

    window.firebaseServices
        .onAuthStateChanged(

            window.firebaseServices.auth,

            async (user) => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }

                console.log(
                    "History Email:",
                    user.email
                );

                window.currentUserRole =
                    await window.getUserRole(
                        user.email
                    );

                console.log(
                    "History Role:",
                    window.currentUserRole
                );

                if (
                    window.currentUserRole !==
                    "admin"
                ) {

                    document.getElementById(
                        "recentlyDeletedBtn"
                    ).style.display =
                        "none";

                }

                window.watchDismissalHistory(

                    (records) => {

                        window.dismissalHistory =
                            records;

                        renderHistory();

                    }

                );

            }

        );

});

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

<div
    id="historyForm"
    class="history-form">

<div class="history-form-title">

    Edit History

</div>

<div class="history-form-date">

    9/24/2026

</div>

<div class="history-time-row">

    <div class="history-time-group">

        <label>
            Start Time
        </label>

<input
    id="historyStartTime"
    type="text">

    </div>

    <div class="history-time-group">

        <label>
            End Time
        </label>

<input
    id="historyEndTime"
    type="text">

    </div>

</div>

    <label>
        Cars Released
    </label>

<input
    id="historyCarsReleased"
    type="number">

    <label
        class="history-checkbox">

        <input
            id="historyRainyDay"
            type="checkbox">

        Rainy Day

    </label>

</div>

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Save Changes

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast hidden"></div>

</body>

</html>
