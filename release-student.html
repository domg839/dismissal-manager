<!DOCTYPE html>
<html>

<head>

    <title>Release Student</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="page-release">

    <div class="container">

        <h1>Release Student</h1>

        <p>Tap a tag to release a student.</p>

        <div class="release-board-wrapper">

            <div id="releaseBoard"></div>

        </div>

        <a href="index.html" class="home-icon">
            <i class="fa-solid fa-house"></i>
        </a>
        
<button
    id="fullscreenBtn"
    class="fullscreen-btn"
    onclick="toggleFullscreen()">

    <i class="fa-solid fa-expand"></i>

</button>


    </div>

    <script type="module" src="firebase.js"></script>

    <script src="app.js"></script>

<script>

    window.addEventListener("load", async () => {

        await loadSettingsFromFirebase();

        window.watchDismissalQueue(

            (records) => {

                dismissalQueue =
                    records;

                renderReleaseBoard();

            }

        );

        setInterval(() => {

            renderReleaseBoard();

        }, 1000);

    });

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Confirm

            </button>

        </div>

    </div>

</div>

</body>

</html>
