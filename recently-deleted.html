<!DOCTYPE html>
<html>

<head>

    <title>Recently Deleted</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="page-history">

<a href="history.html" class="home-icon">
    <i class="fa-solid fa-arrow-left"></i>
</a>

<div class="container">

    <h1>Recently Deleted</h1>

    <div id="deletedHistoryList"></div>

</div>

<script type="module" src="firebase.js"></script>

<script src="app.js"></script>

<script>

window.addEventListener("load", () => {

    window.watchDismissalHistory(

        (records) => {

            window.dismissalHistory =
                records;

            renderDeletedHistory();

        }

    );

});

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Confirm

            </button>

        </div>

    </div>

</div>

</body>

</html>
