<!DOCTYPE html>
<html>

<head>

    <title>Recently Deleted</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="page-history">


    
<a href="history.html" class="home-icon">
    <i class="fa-solid fa-arrow-left"></i>
</a>

<div class="container">

    <h1>Recently Deleted</h1>

    <div id="deletedHistoryList"></div>

</div>

<script type="module" src="firebase.js"></script>

<script src="app.js"></script>

<script>

window.addEventListener("load", () => {

const isDemoMode =
    sessionStorage.getItem(
        "demoMode"
    ) === "true";

if (isDemoMode) {

    window.currentUserRole =
        "admin";

    window.dismissalHistory =
        getDemoHistory();

    renderDeletedHistory();

    return;

}

    window.firebaseServices
        .onAuthStateChanged(

            window.firebaseServices.auth,

            async (user) => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }

                const role =
                    await window.getUserRole(
                        user.email
                    );

                console.log(
                    "Recently Deleted Role:",
                    role
                );

                if (role !== "admin") {

                    window.location.href =
                        "history.html";

                    return;

                }

                window.watchDismissalHistory(

                    (records) => {

                        window.dismissalHistory =
                            records;

                        renderDeletedHistory();

                    }

                );

            }

        );

});

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Confirm

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast hidden"></div>

</body>

</html>
