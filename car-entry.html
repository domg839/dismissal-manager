<!DOCTYPE html>
<html>

<head>

    <title>Car Entry</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="page-car">

    <a href="home.html" class="home-icon">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="container">

        <h1>Car Entry</h1>

<input
    type="text"
    id="tagInput"
    placeholder="Enter Tag(s)">

<p class="helper-text">
    Press Enter to add vehicle
</p>

<div id="connectionStatus" class="connection-status"></div>

        <div class="recent-card">

            <h2>Recent Entries</h2>

            <div id="recentEntries"></div>

        </div>

    </div>

    <script type="module" src="firebase.js"></script>

    <script src="app.js"></script>

<script>

    window.addEventListener("load", async () => {

        await loadSettingsFromFirebase();

if (window.isDemoMode) {

    dismissalQueue =
        getDemoQueue();

    renderQueue();

    updateConnectionStatus();

} else {

    window.watchDismissalQueue(

        (records) => {

            dismissalQueue =
                records;

            renderQueue();

            updateConnectionStatus();

        }

    );

}

    });

    document
        .getElementById("tagInput")
        .addEventListener(
            "keypress",
            function (event) {

                if (event.key === "Enter") {

                    addVehicle();

                }

            }
        );

window.addEventListener(
    "online",
    () => {

        updateConnectionStatus();

    }
);

window.addEventListener(
    "offline",
    () => {

        updateConnectionStatus();

    }
);

    updateConnectionStatus();

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

        <h2 id="modalTitle"></h2>

        <p
            id="modalMessage"
            class="modal-message">
        </p>

        <input
            id="modalInput"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

            <button
                id="modalConfirm"
                class="modal-confirm">

                Confirm

            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast hidden"></div>

</body>

</html>
