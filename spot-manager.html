<!DOCTYPE html>
<html>

<head>
    <title>Spot Manager</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="page-spot">

    <div class="container">

        <h1>Spot Manager</h1>

<button
    class="btn-locate-student"
    onclick="locateStudent()">

    <i class="fa-solid fa-magnifying-glass"></i>

    Locate Student

</button>
        
        <p>
            Tap a tag to request a student. Tap again to cancel.
        </p>

        <div class="release-board-wrapper">

            <div id="spotManagerBoard"></div>

        </div>

<a href="home.html" class="home-icon">
    <i class="fa-solid fa-house"></i>
</a>

<button
    id="fullscreenBtn"
    class="fullscreen-btn"
    onclick="toggleFullscreen()">

    <i class="fa-solid fa-expand"></i>

</button>

    </div>

<script type="module" src="firebase.js"></script>

<script src="app.js"></script>

<script>

    window.addEventListener("load", async () => {

        await loadSettingsFromFirebase();

        window.watchDismissalQueue(

            (records) => {

                dismissalQueue =
                    records;

                renderSpotManager();

            }

        );

        setInterval(() => {

            renderSpotManager();

        }, 1000);

    });

</script>

<div id="appModal" class="app-modal hidden">

    <div class="app-modal-content">

<h2 id="modalTitle"></h2>

<p
    id="modalMessage"
    class="modal-message">
</p>

<input
    id="modalInput"
    type="text"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false">

        <div class="modal-buttons">

            <button
                id="modalCancel"
                class="modal-cancel">

                Cancel

            </button>

<button
    id="modalConfirm"
    class="modal-confirm">

    Confirm

</button>

        </div>

    </div>

</div>

<div id="toast" class="toast hidden"></div>

</body>

</html>
